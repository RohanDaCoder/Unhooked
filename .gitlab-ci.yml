# Unhooked CI — merge-gated release press on main.
#
# Flow: a dev → main merge builds both flavors; if gradle.properties carries a
# version with no matching GitLab Release yet, the APKs are published as a new
# release (classic + clone assets) that the in-app updater picks up.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   GITHUB_ACTOR    GitHub username (Morphe registry auth for the Gradle plugin).
#   GITHUB_TOKEN    GitHub token with read:packages, masked (same).
#   GITLAB_API_TOKEN  Project access token with api scope, masked. Creates the
#                     release (JOB-TOKEN cannot mint tags).
# Optional:
#   INPUT_APK_URL   Stock Instagram bundle to patch (default: self-hosted base
#     in this project's Package Registry, below).
#   UNHOOKED_KEYSTORE_B64   base64 of the release keystore (plain Variable holding
#     the base64 text — the job decodes it; NOT a File variable).
#   UNHOOKED_KEYSTORE_PASS / UNHOOKED_KEY_ALIAS — release signing. Publish
#     hard-fails without them; without them the APKs are throwaway-signed.
#   RELEASE_CERT_SHA256 — pins the release signing cert (get it from
#     `apksigner verify --print-certs` on a release-signed APK). Unset skips
#     the pin with a warning.

stages:
  - build
  - publish

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  ANDROID_HOME: "/opt/android-sdk"
  INPUT_APK_URL: "https://gitlab.com/api/v4/projects/86891782/packages/generic/unhooked-base/454.0.0.13.77/base-454.apkm"

cache:
  key: unhooked-main
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
    - tools/

# JDK 21 + Android SDK are baked into the job image
# (.gitlab/ci-image/Dockerfile, registry tag encodes the pins), so setup is
# just PATH + a runnable gradlew.
before_script:
  - export PATH="/opt/android-sdk/build-tools/36.0.0:/opt/android-sdk/platform-tools:$HOME/.local/bin:$PATH"
  - chmod +x gradlew

# Base is downloaded once and fanned out via `needs` artifacts — flavors
# must not download it themselves (parallel runners each paid a full
# download before). Always a fresh download: the base is immutable at its
# registry path, and the size/zip gates below catch error pages.
fetch-base:
  stage: build
  image: registry.gitlab.com/rohandacoder/unhooked/ci:jdk21-sdk36.0.0-v1
  timeout: 15m
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - test -n "$INPUT_APK_URL" || (echo "INPUT_APK_URL is not set" >&2 && exit 1)
    - curl -sSL --retry 3 --fail -o base.xapk "$INPUT_APK_URL"
    - test "$(stat -c%s base.xapk)" -gt 100000000 || (echo "base.xapk suspiciously small — probably an error page" >&2 && exit 1)
    - unzip -l base.xapk > /dev/null || (echo "base.xapk is not a valid archive" >&2 && exit 1)
    - ls -la base.xapk
  artifacts:
    expire_in: 1 day
    paths:
      - base.xapk

# Flavors build in parallel (separate runners); publish fans in on both.
.flavor-build:
  stage: build
  image: registry.gitlab.com/rohandacoder/unhooked/ci:jdk21-sdk36.0.0-v1
  timeout: 45m
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-classic:
  extends: .flavor-build
  needs:
    - job: fetch-base
      artifacts: true
  script:
    # --- preflight: fail fast on config and inputs, before burning minutes ---
    - test -n "$GITHUB_TOKEN" || (echo "GITHUB_TOKEN is not set" >&2 && exit 1)
    - |
      if [ -n "$UNHOOKED_KEYSTORE_B64" ]; then
        echo "$UNHOOKED_KEYSTORE_B64" | base64 -d > unhooked.keystore
      fi
    # Classic build (replaces stock Instagram). buildApk fails unless every
    # patch applies and the applied set matches the patch bundle's own
    # declared defaults (checkPatches, finalizedBy patchApk — the gate rides
    # along; no committed expected-list involved).
    - UNHOOKED_OUTPUT_PATH=unhooked-classic.apk ./gradlew buildApk "-Papk=base.xapk" --console=plain
    - cp build/patch-report.json patch-report-classic.json
    # --- verify: signature + identity ---
    - apksigner verify --print-certs unhooked-classic.apk | tee certs-classic.txt
    - test "$(aapt dump badging unhooked-classic.apk | awk -F"'" '/^package:/{print $2}')" = "com.instagram.android"
    - ls -la unhooked-classic.apk
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - unhooked-classic.apk
      - patch-report-classic.json
      # The raw report survives gate failures (the cp above never ran).
      - build/patch-report.json
      - certs-classic.txt

build-clone:
  extends: .flavor-build
  needs:
    - job: fetch-base
      artifacts: true
  script:
    # --- preflight: base arrives via needs: fetch-base ---
    - test -n "$GITHUB_TOKEN" || (echo "GITHUB_TOKEN is not set" >&2 && exit 1)
    - |
      if [ -n "$UNHOOKED_KEYSTORE_B64" ]; then
        echo "$UNHOOKED_KEYSTORE_B64" | base64 -d > unhooked.keystore
      fi
    # Clone build (installs alongside stock Instagram). Same gate as classic:
    # buildApk fails unless every patch applies and the applied set matches
    # the bundle's defaults — with -Pclone passed, the gate itself adds the
    # opt-in Clone patch to the expectation.
    - UNHOOKED_OUTPUT_PATH=unhooked-clone.apk ./gradlew buildApk "-Papk=base.xapk" -Pclone --console=plain
    - cp build/patch-report.json patch-report-clone.json
    # --- verify: signature + identity ---
    - apksigner verify --print-certs unhooked-clone.apk | tee certs-clone.txt
    - test "$(aapt dump badging unhooked-clone.apk | awk -F"'" '/^package:/{print $2}')" = "com.instagram.android.unhooked"
    - ls -la unhooked-clone.apk
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - unhooked-clone.apk
      - patch-report-clone.json
      # The raw report survives gate failures (the cp above never ran).
      - build/patch-report.json
      - certs-clone.txt

publish-release:
  stage: publish
  image: registry.gitlab.com/rohandacoder/unhooked/ci:jdk21-sdk36.0.0-v1
  timeout: 10m
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - job: build-classic
      artifacts: true
    - job: build-clone
      artifacts: true
  script:
    - bash scripts/publish-release.sh
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
      - release.json
